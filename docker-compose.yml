services:
  # ---------------------------------------------------------------------------
  # MySQL Relational Database
  # ---------------------------------------------------------------------------
  db:
    image: mysql:8.0
    container_name: stayease_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: stayease_db
      MYSQL_USER: stayease_user
      MYSQL_PASSWORD: stayease_secure_password
    ports:
      - "3306:3306"
    volumes:
      - stayease_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # FastAPI REST Backend
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: stayease_backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: mysql+pymysql://stayease_user:stayease_secure_password@db:3306/stayease_db
      SECRET_KEY: ${SECRET_KEY:-production_secret_key_change_in_production_environment_32chars}
      CORS_ORIGINS: "http://localhost,http://localhost:80,http://localhost:5173,http://127.0.0.1:5173"
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    ports:
      - "8000:8000"

  # ---------------------------------------------------------------------------
  # React + Vite Frontend
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8000/api
    container_name: stayease_frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  stayease_mysql_data:
    driver: local
